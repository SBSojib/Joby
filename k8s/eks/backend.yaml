apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: joby
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: joby
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: "true"
    spec:
      serviceAccountName: joby-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/joby-prod-backend:a1b2c3d4e5f6789012345678901234abcd567890
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: joby-config
            - secretRef:
                name: joby-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: joby-backend
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=joby,deployment.environment=production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://adot-collector.amazon-cloudwatch:4317
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
