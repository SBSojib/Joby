apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: joby
  namespace: joby
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/wafv2-acl-arn: REPLACE_WITH_WAF_WEB_ACL_ARN
    external-dns.alpha.kubernetes.io/hostname: REPLACE_WITH_APP_HOSTNAME
spec:
  ingressClassName: alb
  rules:
    - host: REPLACE_WITH_APP_HOSTNAME
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
