apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: joby-secrets
  namespace: joby
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: joby-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__DefaultConnection
      remoteRef:
        key: REPLACE_WITH_APPLICATION_SECRET_NAME
        property: ConnectionStrings__DefaultConnection
    - secretKey: Jwt__Secret
      remoteRef:
        key: REPLACE_WITH_APPLICATION_SECRET_NAME
        property: Jwt__Secret
